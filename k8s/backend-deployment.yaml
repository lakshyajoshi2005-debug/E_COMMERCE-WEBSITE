#Ye kya karega? Kubernetes ko batayega ki 
#Django backend ka ek instance run karna hai, Docker image se.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-backend
  template:
    metadata:
      labels:
        app: ecommerce-backend
    spec:
      containers:
        - name: backend
          image: ecommerce-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: host.docker.internal
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: ecommerce-db